version: '3.8'

services:
  vancomycin-trough-peak-steady-state:
    build: .
    container_name: vancomycin-trough-peak-steady-state
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=vancomycin-trough-peak-steady-state-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
