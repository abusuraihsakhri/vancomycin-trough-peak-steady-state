name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "pydantic>=2,<3" "pytest>=8,<10"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run Python test suite
        run: python -m pytest -q

  browser-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser pharmacokinetics
        run: node --test web/pk.test.mjs
